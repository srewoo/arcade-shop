<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Clay Day: a first-person clay target shooting game with doubles, crossing pairs, wind and ratings." />
    <title>Clay Day</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f93d1'/><ellipse cx='32' cy='30' rx='22' ry='9' fill='%23ff8a1f' stroke='%2324140a' stroke-width='4'/><ellipse cx='32' cy='30' rx='11' ry='4' fill='%23ffd08a'/></svg>"
    />
  </head>
  <body>
    <main class="app" id="app">
      <header class="top">
        <h1 class="logo">
          <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="17" ry="8" fill="#ff8a1f" stroke="#24140a" stroke-width="3"/><ellipse cx="20" cy="20" rx="8" ry="3.5" fill="#ffd08a"/></svg>
          <span>Clay Day</span>
        </h1>
        <div class="top-actions">
          <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on" title="Sound (M)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9z"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
          </button>
          <button id="open-settings" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.38 10.17L21.91 10.67L21.91 13.33L19.38 13.83L18.51 15.92L19.95 18.07L18.07 19.95L15.92 18.51L13.83 19.38L13.33 21.91L10.67 21.91L10.17 19.38L8.08 18.51L5.93 19.95L4.05 18.07L5.49 15.92L4.62 13.83L2.09 13.33L2.09 10.67L4.62 10.17L5.49 8.08L4.05 5.93L5.93 4.05L8.08 5.49L10.17 4.62L10.67 2.09L13.33 2.09L13.83 4.62L15.92 5.49L18.07 4.05L19.95 5.93L18.51 8.08Z"/><circle cx="12" cy="12" r="3.2"/></svg>
          </button>
          <button id="pause" class="icon-btn" type="button" aria-label="Pause" aria-haspopup="dialog" title="Pause (P)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5v14M16 5v14"/></svg>
          </button>
        </div>
      </header>

      <section class="hud" aria-label="Round status">
        <div class="stats-row">
          <div class="chip"><span class="k">Round</span><b id="hud-round">1</b></div>
          <div class="chip"><span class="k">Score</span><b id="hud-score">0</b></div>
          <div class="chip" id="chip-time"><span class="k">Time</span><b id="hud-time">--</b></div>
          <div class="chip" id="chip-wind"><span class="k">Wind</span><b id="hud-wind">Calm</b></div>
        </div>
        <div class="gun-row">
          <div class="chip shells"><span class="k">Shells</span><div class="shell-row" id="shells" role="img" aria-label="2 shells"><i></i><i></i></div></div>
          <div class="chip" id="chip-combo"><span class="k">Combo</span><b id="hud-combo">x1</b></div>
          <button id="reload" class="reload-btn" type="button" title="Reload (R)"><span id="reload-label">Reload</span><span class="bar" id="reload-bar"></span></button>
        </div>
        <div class="tally" id="tally" role="img" aria-label="Clay tally"></div>
      </section>

      <p id="onboard" class="banner" hidden>
        <span id="onboard-text"></span>
        <button id="onboard-close" class="icon-btn" type="button" aria-label="Dismiss hint">×</button>
      </p>

      <div class="stage" id="stage">
        <canvas id="field" tabindex="0" role="img" aria-label=""></canvas>
        <div id="callout" class="callout" aria-hidden="true"></div>
      </div>
    </main>

    <div id="title-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="title-h" hidden>
      <div class="sheet title-sheet">
        <canvas id="title-art" class="title-art" aria-hidden="true"></canvas>
        <h2 id="title-h">Clay Day</h2>
        <p id="tagline" class="desc"></p>
        <div class="options stack">
          <fieldset data-setting="mode">
            <legend>Mode</legend>
            <button type="button" data-value="campaign">Campaign</button>
            <button type="button" data-value="practice">Practice</button>
          </fieldset>
          <fieldset data-setting="practiceRound" id="practice-field">
            <legend>Practice round</legend>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="10">10</button>
          </fieldset>
          <p id="mode-desc" class="desc"></p>
          <p id="best-line" class="desc"></p>
        </div>
        <div class="stack">
          <button id="title-start" class="btn primary" type="button">Start</button>
          <button id="title-howto" class="btn" type="button" aria-haspopup="dialog">How to play</button>
          <button id="title-settings" class="btn" type="button" aria-haspopup="dialog">Settings</button>
        </div>
      </div>
    </div>

    <div id="howto-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="howto-h" hidden>
      <div class="sheet">
        <h2 id="howto-h">How to play</h2>
        <ul id="howto-list"></ul>
        <p class="desc" id="howto-keys"></p>
        <button id="howto-close" class="btn primary" type="button">Done</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
      <div class="sheet">
        <h2 id="pause-title">Paused</h2>
        <p id="pause-note" class="desc"></p>
        <div class="stack">
          <button id="pause-resume" class="btn primary" type="button">Resume</button>
          <button id="pause-restart" class="btn" type="button">Restart round</button>
          <button id="pause-settings" class="btn" type="button" aria-haspopup="dialog">Settings</button>
          <button id="pause-quit" class="btn" type="button">Quit to title</button>
        </div>
        <div id="pause-confirm" class="confirm-bar" role="group" aria-label="Confirm" hidden>
          <span id="pause-confirm-text"></span>
          <button id="pause-confirm-yes" class="btn small primary" type="button">Yes</button>
          <button id="pause-confirm-no" class="btn small" type="button">Keep playing</button>
        </div>
      </div>
    </div>

    <div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="sheet result-sheet" id="result-sheet">
        <h2 id="result-title"></h2>
        <p class="result-stars" id="result-stars" aria-hidden="true"></p>
        <p class="result-rating" id="result-rating"></p>
        <p class="result-big" id="result-big"></p>
        <dl class="stats" id="result-stats"></dl>
        <p class="desc" id="result-note"></p>
        <div class="stack">
          <button id="result-next" class="btn primary" type="button">Next round</button>
          <button id="result-title-btn" class="btn" type="button">Title screen</button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="sheet">
        <h2 id="settings-title">Settings</h2>
        <div class="options">
          <div class="row">
            <label for="volume" class="lbl">Volume</label>
            <input id="volume" type="range" min="0" max="100" step="5" value="70" />
            <output id="volume-out" for="volume">70</output>
          </div>
          <fieldset data-setting="sound">
            <legend>Sound</legend>
            <button type="button" data-value="true">On</button>
            <button type="button" data-value="false">Muted</button>
          </fieldset>
          <fieldset data-setting="reduceMotion">
            <legend>Reduce motion</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="on">On</button>
            <button type="button" data-value="off">Off</button>
          </fieldset>
          <fieldset data-setting="colorAssist">
            <legend>Colour-blind assist</legend>
            <button type="button" data-value="false">Off</button>
            <button type="button" data-value="true">On</button>
          </fieldset>
          <fieldset data-setting="textSize">
            <legend>Text size</legend>
            <button type="button" data-value="100">100%</button>
            <button type="button" data-value="125">125%</button>
            <button type="button" data-value="150">150%</button>
          </fieldset>
          <fieldset data-setting="theme">
            <legend>Theme</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="light">Light</button>
            <button type="button" data-value="dark">Dark</button>
          </fieldset>
        </div>
        <button id="settings-close" class="btn primary" type="button">Done</button>
      </div>
    </div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
