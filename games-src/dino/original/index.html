<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7dfc2" />
    <meta name="description" content="Dino Run: Locked In - a 3D ragdoll endless runner. Maximum focus, minimum coordination." />
    <title>Dino Run: Locked In</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-CLlHzaJN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-hIOaSPKP.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>

    <!-- Top centre. The score stays visible when the rest of the UI is hidden with H. -->
    <div id="score">
      <span id="best">BEST 00000</span>
      <span id="points">00000</span>
    </div>

    <div id="ui">
      <div id="badges">
        <span id="badge-auto" class="badge hidden">AUTOPLAY</span>
        <span id="badge-mute" class="badge hidden">MUTED</span>
      </div>

      <section id="title" class="panel">
        <h1>DINO RUN<small>LOCKED IN</small></h1>
        <p class="tag">Maximum focus. Minimum coordination.</p>
        <p class="cta">
          <span class="for-keys">PRESS SPACE TO RUN</span>
          <span class="for-touch">TAP TO RUN</span>
        </p>
      </section>

      <section id="gameover" class="panel hidden">
        <h2>GAME OVER</h2>
        <p id="quip"></p>
        <p id="final">SCORE <b id="final-score">0</b><span id="new-best" class="hidden">NEW BEST</span></p>
        <form id="save" class="hidden" autocomplete="off">
          <input id="save-name" maxlength="16" placeholder="Your name" autocapitalize="off" spellcheck="false" enterkeyhint="send" />
          <button id="save-send" class="btn small" type="submit">SAVE</button>
          <button id="save-skip" class="btn small ghost" type="button">SKIP</button>
          <p id="save-msg"></p>
        </form>
        <ol id="board" class="hidden"></ol>
        <button id="btn-restart" class="btn" type="button">RUN IT BACK</button>
      </section>

      <div id="hints">
        <span class="for-keys"><kbd>Space</kbd>/<kbd>&uarr;</kbd> jump &middot; <kbd>&darr;</kbd> duck &middot; <kbd>A</kbd> autoplay &middot; <kbd>H</kbd> hide UI &middot; <kbd>M</kbd> mute</span>
      </div>
    </div>

    <div id="loading">Loading&hellip;</div>

  </body>
</html>
