<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Rebound Row: a brick-breaker with 34 hand-made levels, power-ups and an endless mode." />
    <title>Rebound Row</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e1530'/><rect x='10' y='12' width='20' height='9' rx='3' fill='%233ec1f2'/><rect x='34' y='12' width='20' height='9' rx='3' fill='%23f4c542'/><circle cx='34' cy='38' r='5' fill='%23fff'/><rect x='18' y='50' width='28' height='6' rx='3' fill='%23eef1fb'/></svg>"
    />
  </head>
  <body>
    <main class="app" id="app" data-screen="title">
      <section id="title" class="screen title dark-scope" aria-labelledby="brand">
        <div class="title-card">
          <canvas id="title-art" class="title-art" width="720" height="400" aria-hidden="true"></canvas>
          <h1 id="brand" class="wordmark">Rebound <span>Row</span></h1>
          <p id="tagline" class="tagline"></p>
          <nav class="menu" aria-label="Main menu">
            <button id="btn-play" class="btn primary" type="button">Play</button>
            <button id="btn-levels" class="btn" type="button" aria-haspopup="dialog">Levels</button>
            <button id="btn-endless" class="btn" type="button">Endless</button>
            <button id="btn-how" class="btn" type="button" aria-haspopup="dialog">How to play</button>
            <button id="btn-settings" class="btn" type="button" aria-haspopup="dialog">Settings</button>
          </nav>
          <p id="title-stats" class="stats-line"></p>
        </div>
      </section>

      <section id="game" class="screen game dark-scope" aria-label="Game" hidden>
        <div class="stage" id="stage">
          <canvas id="canvas" tabindex="0" role="img"></canvas>
          <div class="field-ui" id="field-ui">
            <header class="hud" id="hud">
              <dl class="stats">
                <div class="stat score-stat"><dt>Score</dt><dd id="hud-score">0</dd></div>
                <div class="stat"><dt>Lives</dt><dd><span id="hud-hearts" class="hearts" aria-hidden="true"></span><span id="hud-lives" class="sr-only">3</span></dd></div>
                <div class="stat"><dt>Level</dt><dd id="hud-level">1</dd></div>
              </dl>
              <div class="hud-btns">
                <button id="btn-settings-game" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.36 11.27L21.95 12.98L21.57 14.90L18.53 15.49L17.72 16.69L18.34 19.73L16.71 20.82L14.15 19.08L12.73 19.36L11.02 21.95L9.10 21.57L8.51 18.53L7.31 17.72L4.27 18.34L3.18 16.71L4.92 14.15L4.64 12.73L2.05 11.02L2.43 9.10L5.47 8.51L6.28 7.31L5.66 4.27L7.29 3.18L9.85 4.92L11.27 4.64L12.98 2.05L14.90 2.43L15.49 5.47L16.69 6.28L19.73 5.66L20.82 7.29L19.08 9.85Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause" aria-haspopup="dialog" title="Pause (P)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
                </button>
              </div>
            </header>
            <div id="prompt" class="prompt" aria-hidden="true"></div>
            <div id="onboard" class="onboard" role="note" hidden><span id="onboard-text"></span></div>
            <p id="chips" class="chips" aria-label="Active power-ups and combo"></p>
          </div>
        </div>
      </section>
    </main>

    <div id="pause-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
      <div class="sheet">
        <h2 id="pause-title">Paused</h2>
        <div class="stack">
          <button id="pause-resume" class="btn primary" type="button">Resume</button>
          <button id="pause-restart" class="btn" type="button">Restart level</button>
          <button id="pause-settings" class="btn" type="button" aria-haspopup="dialog">Settings</button>
          <button id="pause-quit" class="btn danger" type="button">Quit to title</button>
        </div>
        <div id="pause-confirm" class="confirm-bar" role="group" aria-label="Confirm" hidden>
          <span id="pause-confirm-text"></span>
          <button id="pause-confirm-yes" class="btn small primary" type="button">Yes</button>
          <button id="pause-confirm-no" class="btn small" type="button">Keep playing</button>
        </div>
      </div>
    </div>

    <div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="sheet">
        <h2 id="result-title"></h2>
        <p id="result-tier" class="tier" hidden></p>
        <p id="result-body" class="desc"></p>
        <div class="stack">
          <button id="result-next" class="btn primary" type="button">Next level</button>
          <button id="result-retry" class="btn" type="button">Try again</button>
          <button id="result-menu" class="btn" type="button">Menu</button>
        </div>
      </div>
    </div>

    <div id="levels-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="levels-title" hidden>
      <div class="sheet wide">
        <h2 id="levels-title">Levels</h2>
        <ol id="levels-grid" class="level-grid"></ol>
        <button id="levels-close" class="btn" type="button">Back</button>
      </div>
    </div>

    <div id="how-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="how-title" hidden>
      <div class="sheet">
        <h2 id="how-title">How to play</h2>
        <ul id="how-list" class="how"></ul>
        <p class="keys">Keys: <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> move, <kbd>Space</kbd> launch, <kbd>P</kbd> or <kbd>Esc</kbd> pause, <kbd>M</kbd> mute.</p>
        <button id="how-close" class="btn primary" type="button">Back</button>
      </div>
    </div>

    <div id="settings-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="sheet">
        <h2 id="settings-title">Settings</h2>
        <div class="options">
          <div class="row">
            <label for="volume" class="lbl">Volume</label>
            <input id="volume" type="range" min="0" max="100" step="5" value="70" />
            <output id="volume-out" for="volume">70</output>
          </div>
          <fieldset data-setting="sound">
            <legend>Sound</legend>
            <button type="button" data-value="true">On</button>
            <button type="button" data-value="false">Muted</button>
          </fieldset>
          <fieldset data-setting="reduceMotion">
            <legend>Reduce motion</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="on">On</button>
            <button type="button" data-value="off">Off</button>
          </fieldset>
          <fieldset data-setting="colorAssist">
            <legend>Colour-blind assist</legend>
            <button type="button" data-value="false">Off</button>
            <button type="button" data-value="true">On</button>
          </fieldset>
          <fieldset data-setting="textSize">
            <legend>Text size</legend>
            <button type="button" data-value="100">100%</button>
            <button type="button" data-value="125">125%</button>
            <button type="button" data-value="150">150%</button>
          </fieldset>
          <fieldset data-setting="theme">
            <legend>Theme</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="light">Light</button>
            <button type="button" data-value="dark">Dark</button>
          </fieldset>
        </div>
        <button id="settings-close" class="btn primary" type="button">Done</button>
      </div>
    </div>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
