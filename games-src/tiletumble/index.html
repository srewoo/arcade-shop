<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tile Tumble: clear groups of same-colour discs. Classic, move limit, endless and daily puzzles." />
    <title>Tile Tumble</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231c2138'/><circle cx='22' cy='22' r='10' fill='%23ff6b57'/><circle cx='42' cy='22' r='10' fill='%2347b8ff'/><circle cx='22' cy='42' r='10' fill='%233fd98f'/><circle cx='42' cy='42' r='10' fill='%23ffc43d'/></svg>"
    />
  </head>
  <body>
    <main class="app" id="app" data-screen="menu">
      <header class="top">
        <h1 class="logo">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="9" r="6" class="c0"/><circle cx="23" cy="9" r="6" class="c3"/><circle cx="9" cy="23" r="6" class="c2"/><circle cx="23" cy="23" r="6" class="c1"/></svg>
          <span class="logo-text">Tile Tumble</span>
        </h1>
        <div class="top-actions">
          <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on" title="Sound (M)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9z"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
          </button>
          <button id="open-settings" class="icon-btn labelled" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 4.7L10.2 1.7L13.8 1.7L14.2 4.7L15.5 5.3L18.1 3.4L20.6 5.9L18.7 8.5L19.3 9.8L22.3 10.2L22.3 13.8L19.3 14.2L18.7 15.5L20.6 18.1L18.1 20.6L15.5 18.7L14.2 19.3L13.8 22.3L10.2 22.3L9.8 19.3L8.5 18.7L5.9 20.6L3.4 18.1L5.3 15.5L4.7 14.2L1.7 13.8L1.7 10.2L4.7 9.8L5.3 8.5L3.4 5.9L5.9 3.4L8.5 5.3Z"/><circle cx="12" cy="12" r="3.2"/></svg><span class="lab">Settings</span>
          </button>
          <button id="pause" class="icon-btn labelled" type="button" aria-label="Pause" aria-haspopup="dialog" title="Pause (P)" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="bars" d="M8 5v14M16 5v14"/></svg><span class="lab">Pause</span>
          </button>
        </div>
      </header>

      <section id="menu" class="menu" aria-label="Choose a mode">
        <div class="hero-wrap" id="hero"></div>
        <p class="tagline" id="tagline"></p>
        <div class="modes" id="modes"></div>
        <p class="hint" id="menu-hint"></p>
      </section>

      <section id="stats" class="stats" aria-label="Game status" hidden>
        <div class="stat"><span class="k" id="k-score">Score</span><b id="v-score">0</b></div>
        <div class="stat"><span class="k" id="k-best">Best</span><b id="v-best">0</b></div>
        <div class="stat"><span class="k" id="k-extra">Moves</span><b id="v-extra">0</b></div>
        <div class="stat" id="stat-target" hidden><span class="k" id="k-target">Target</span><b id="v-target">0</b></div>
        <div class="stat"><span class="k" id="k-discs">Discs</span><b id="v-discs">0</b></div>
      </section>

      <p id="onboard" class="banner off" hidden>
        <span id="onboard-text"></span>
        <button id="onboard-close" class="icon-btn" type="button" aria-label="Dismiss hint">&times;</button>
      </p>

      <div id="board-slot" class="board-slot" hidden>
        <div id="board-wrap" class="board-wrap">
          <canvas id="board" tabindex="0" role="application" aria-label="Tile Tumble board"></canvas>
        </div>
      </div>

      <p id="preview" class="preview" data-tone="info" hidden></p>

      <div id="actions" class="actions" hidden>
        <button id="undo" class="btn" type="button"><span id="undo-label">Undo</span> <kbd>Z</kbd></button>
        <button id="new-game" class="btn" type="button"><span id="new-label">New game</span> <kbd>N</kbd></button>
        <button id="to-menu" class="btn ghost" type="button">Menu</button>
      </div>
      <p id="keys" class="hint keys" hidden></p>
    </main>

    <div id="pause-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
      <div class="sheet">
        <h2 id="pause-title">Paused</h2>
        <p id="pause-note" class="desc"></p>
        <div class="stack">
          <button id="pause-resume" class="btn primary" type="button">Resume</button>
          <button id="pause-restart" class="btn" type="button">Restart</button>
          <button id="pause-settings" class="btn" type="button">Settings</button>
          <button id="pause-quit" class="btn" type="button">Quit to title</button>
        </div>
        <div id="pause-confirm" class="confirm-bar" role="group" aria-label="Confirm" hidden>
          <span id="pause-confirm-text"></span>
          <button id="pause-confirm-yes" class="btn small primary" type="button">Yes</button>
          <button id="pause-confirm-no" class="btn small" type="button">Keep playing</button>
        </div>
      </div>
    </div>

    <div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="sheet">
        <h2 id="result-title"></h2>
        <p id="result-score" class="big"></p>
        <p id="result-detail" class="desc"></p>
        <div class="stack">
          <button id="result-again" class="btn primary" type="button">Play again</button>
          <button id="result-menu" class="btn" type="button">Title</button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="sheet">
        <h2 id="settings-title">Settings</h2>
        <div class="options">
          <div class="row">
            <label for="volume" class="lbl">Volume</label>
            <input id="volume" type="range" min="0" max="100" step="5" value="70" />
            <output id="volume-out" for="volume">70</output>
          </div>
          <fieldset data-setting="sound">
            <legend>Sound</legend>
            <button type="button" data-value="true">On</button>
            <button type="button" data-value="false">Muted</button>
          </fieldset>
          <fieldset data-setting="reduceMotion">
            <legend>Reduce motion</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="on">On</button>
            <button type="button" data-value="off">Off</button>
          </fieldset>
          <fieldset data-setting="colorAssist">
            <legend>Colour-blind assist</legend>
            <button type="button" data-value="false">Off</button>
            <button type="button" data-value="true">On</button>
          </fieldset>
          <fieldset data-setting="textSize">
            <legend>Text size</legend>
            <button type="button" data-value="100">100%</button>
            <button type="button" data-value="125">125%</button>
            <button type="button" data-value="150">150%</button>
          </fieldset>
          <fieldset data-setting="theme">
            <legend>Theme</legend>
            <button type="button" data-value="system">System</button>
            <button type="button" data-value="light">Light</button>
            <button type="button" data-value="dark">Dark</button>
          </fieldset>
        </div>
        <button id="settings-close" class="btn primary" type="button">Done</button>
      </div>
    </div>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
